<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit App - Handebol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SCRIPT DO TEMA (Modo Claro/Escuro) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
        
        // Verifica o tema salvo antes de carregar a tela (evita aquele "piscar" branco)
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
        
        // Função do botão que alterna as cores
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased transition-colors duration-300">
    
    <div class="max-w-md mx-auto bg-white dark:bg-gray-800 min-h-screen shadow-lg transition-colors duration-300">
        
        <!-- Cabeçalho com o botão de alternar -->
        <header class="bg-black text-white p-8 rounded-b-3xl shadow-md text-center relative border-b border-transparent dark:border-gray-700 transition-colors duration-300">
            
            <button onclick="toggleTheme()" class="absolute top-4 right-4 bg-gray-800 hover:bg-gray-700 p-2 rounded-full shadow active:scale-95 transition text-xl">
                🌓
            </button>
            
            <h1 class="text-4xl font-extrabold text-yellow-400 tracking-tight">Fit App</h1>
            <p class="text-sm mt-2 text-gray-300">Preparação Física - Handebol</p>
        </header>

        <main class="p-6 mt-6">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-700 dark:text-gray-200">Escolha seu Treino</h2>
            
            <div class="flex flex-col gap-4">
                {% for treino in treinos %}
    
                    {% if treino == 'Alongamento' %}
                    <a href="/treino/{{ treino }}" class="block w-full bg-blue-500 hover:bg-blue-600 active:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-bold text-lg py-5 px-6 rounded-2xl shadow text-center transition transform active:scale-95">
                        🧘‍♂️ {{ treino }}
                    </a>
                    
                    {% elif treino == 'Preventivo' or treino == 'Mobilidade' %}
                    <a href="/treino/{{ treino }}" class="block w-full bg-green-400 hover:bg-green-500 active:bg-green-600 dark:bg-green-500 dark:hover:bg-green-400 text-black dark:text-gray-900 font-bold text-lg py-5 px-6 rounded-2xl shadow text-center transition transform active:scale-95">
                        🛡️ {{ treino }}
                    </a>
                    
                    {% else %}
                    <a href="/treino/{{ treino }}" class="block w-full bg-yellow-400 hover:bg-yellow-500 active:bg-yellow-600 dark:bg-yellow-500 dark:hover:bg-yellow-400 text-black dark:text-gray-900 font-bold text-lg py-5 px-6 rounded-2xl shadow text-center transition transform active:scale-95">
                        🏋️‍♂️ {{ treino }}
                    </a>
                    {% endif %}
                    
                {% endfor %}
            </div>

            <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
                <a href="https://docs.google.com/spreadsheets/d/1WyqIrrm4PslwT646C4m-qoEWe5IKn89S/edit?gid=938345488#gid=938345488" target="_blank" class="block w-full bg-blue-100 dark:bg-gray-700 hover:bg-blue-200 dark:hover:bg-gray-600 text-blue-700 dark:text-blue-400 font-bold text-base py-4 px-6 rounded-2xl shadow-sm text-center transition active:scale-95 flex items-center justify-center gap-2 border border-blue-200 dark:border-gray-600">
                    📊 Abrir Planilha
                </a>
            </div>
        </main>

    </div>

</body>
</html>
