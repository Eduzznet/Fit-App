<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ categoria }} - Fit App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased transition-colors duration-300">
    
    <div class="max-w-md mx-auto bg-white dark:bg-gray-800 min-h-screen shadow-lg transition-colors duration-300">
        
        <header class="bg-black text-white p-6 rounded-b-3xl shadow-md flex items-center justify-between relative border-b border-transparent dark:border-gray-700">
            <a href="/" class="text-yellow-400 font-bold text-sm bg-gray-800 dark:bg-gray-700 px-3 py-2 rounded-lg hover:bg-gray-700 dark:hover:bg-gray-600 transition">
                ⬅ Voltar
            </a>
            
            <button onclick="toggleTheme()" class="absolute top-5 right-4 bg-gray-800 hover:bg-gray-700 p-2 rounded-full shadow active:scale-95 transition text-lg">
                🌓
            </button>
            
            <h1 class="text-2xl font-extrabold text-yellow-400 tracking-tight truncate ml-4 mr-10">{{ categoria }}</h1>
        </header>

        <main class="p-6 mt-6">
            <h2 class="text-xl font-bold mb-6 text-center text-gray-700 dark:text-gray-200">Selecione o treino:</h2>
            
            <div class="flex flex-col gap-4">
                {% for sub in subtreinos %}
                <a href="/treino/{{ categoria }}/{{ sub }}" class="block w-full bg-gray-100 dark:bg-gray-700 border-2 border-gray-300 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-100 font-bold text-lg py-5 px-6 rounded-2xl shadow-sm text-center transition transform active:scale-95">
                    {{ sub }}
                </a>
                {% endfor %}
            </div>
        </main>

    </div>

</body>
</html>
